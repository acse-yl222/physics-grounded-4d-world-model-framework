name: Package and workspace portability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . build
      - run: python tools/check_contract.py examples/contract-v1/manifest.json
      - run: python tools/check_contract.py examples/contract-v1.1/manifest.json
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_viewer.mjs tests/test_model_source.mjs tests/test_random_uav.mjs
      - run: python -m build
      - name: Install the wheel in a separate environment
        run: |
          python -m venv /tmp/p4d-wheel-env
          /tmp/p4d-wheel-env/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/p4d-wheel-env/bin/python -I "$GITHUB_WORKSPACE/tools/check_installed.py"
  domain-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[birds,traffic,flow]'
      - run: python -m unittest discover -s tests -p test_package_imports.py -v
  scheduler-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[scheduler]'
      - run: python -m unittest discover -s tests -p 'test_nvmf*.py' -v
        env:
          NVMF_RUN_MEAN_FIELD_TESTS: '1'
