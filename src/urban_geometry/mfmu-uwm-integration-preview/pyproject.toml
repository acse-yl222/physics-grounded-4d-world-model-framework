[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfmu-uav-scheduler"
version = "0.1.0"
description = "Research integration snapshot of a Mean-Field Multiple-Update UAV scheduler"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "BoHan Ye"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
mean-field = ["torch>=2.2"]

[project.scripts]
mfmu-schedule = "mfmu_scheduler.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mfmu_scheduler*", "bounded_studies*", "experiments*", "src*"]

