minimum_pre_commit_version: '4.6.2'
repos:
  - repo: local
    hooks:
      - id: repository-format
        name: Format repository files
        entry: python tools/format.py --write
        language: python
        additional_dependencies:
          - ruff==0.16.10
          - shfmt-py==4.2.0
        types: [file]
        require_serial: true
      - id: repository-lint
        name: Lint Python files
        entry: python tools/format.py --lint
        language: python
        additional_dependencies:
          - ruff==0.16.10
        types: [python]
        require_serial: true
