[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-grounded-4d-world-model-framework"
version = "0.1.0"
description = "A geometry- and physics-grounded framework for evolving 3D worlds across scales"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "numpy>=1.24"]

[project.scripts]
p4d = "common.cli:main"
uwm = "common.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "common*",
    "urban_geometry*",
    "urban_flow*",
    "traffic*",
    "uav_routing*",
    "visualization.adapters*",
]

[tool.setuptools.cmdclass]
build_py = "common._build.BuildPy"

[project.optional-dependencies]
birds = ["scipy>=1.10", "matplotlib>=3.7", "trimesh", "rtree", "tqdm>=4.65"]
traffic = ["torch>=2.1", "matplotlib>=3.7", "bayesian-optimization>=1.4"]
geometry = ["numba", "Pillow", "DracoPy"]
flow = ["torch>=2.1", "scipy>=1.10", "matplotlib>=3.7", "h5py>=3.10"]

[tool.ruff]
target-version = "py311"
line-length = 100
force-exclude = true
extend-exclude = [
    "**/vendor/**",
    ".history",
    "cache",
    ".venv",
    "src/visualization/published-pages",
    "src/visualization/legacy/agents/demo_rev02",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
