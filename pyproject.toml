[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-grounded-4d-world-model-framework"
version = "0.1.0"
description = "A geometry- and physics-grounded framework for evolving 3D worlds across scales"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "numpy>=1.24"]

[project.optional-dependencies]
solar = ["numpy>=2.0", "torch>=2.2", "numba>=0.60", "Pillow>=10"]

[project.scripts]
p4d = "common.cli:main"
uwm = "common.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*", "urban_geometry*", "urban_flow*", "traffic*", "visualization.adapters*"]
