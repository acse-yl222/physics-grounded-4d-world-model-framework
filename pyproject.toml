[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-grounded-4d-world-model-framework"
version = "0.1.0"
description = "A geometry- and physics-grounded framework for evolving 3D worlds across scales"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "numpy>=1.24"]

[project.scripts]
p4d = "common.cli:main"
uwm = "common.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "common*",
    "urban_geometry*",
    "urban_flow*",
    "traffic*",
    "uav_routing*",
    "visualization.adapters*",
]

[tool.setuptools.cmdclass]
build_py = "common._build.BuildPy"

[project.optional-dependencies]
birds = ["scipy>=1.10", "matplotlib>=3.7", "trimesh", "rtree", "tqdm>=4.65"]
traffic = ["torch>=2.1", "matplotlib>=3.7", "bayesian-optimization>=1.4"]
geometry = ["numba", "Pillow", "DracoPy"]
flow = ["torch>=2.1", "scipy>=1.10", "matplotlib>=3.7", "h5py>=3.10"]

[tool.ruff]
target-version = "py311"
line-length = 100
force-exclude = true
extend-exclude = [
    "**/vendor/**",
    ".history",
    "cache",
    ".venv",
    "src/visualization/published-pages",
    "src/visualization/legacy/agents/demo_rev02",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

# `make lint` applies Ruff's default rule set to the files tools/format.py selects.
[tool.ruff.lint]
# Frozen upstream sources, research handoffs and member code keep their recorded text.
exclude = [
    "src/urban_geometry/mfmu-uwm-integration-preview/**",
    "src/urban_flow/physics/environment-integration/**",
    "src/urban_flow/physics/wind_pollution_code/**",
    "src/urban_flow/physics/wind_temperature_teacher/**",
    "src/urban_flow/reference_public/**",
    "src/urban_flow/scenarios/region/AI4Urban_reference.py",
]
# A parsed document with the wrong JSON shape is invalid data, reported as ValueError.
ignore = ["TRY004"]

[tool.ruff.lint.flake8-comprehensions]
# dict(key=value) is the repository's idiom for JSON records.
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.per-file-ignores]
# Building modules import only math; zip(ring, ring[1:]) names polygon edges.
"src/urban_geometry/agent/buildings/*.py" = ["B023", "RUF007"]
# Geometry and plotting helpers here are defined per loop iteration and called only within
# that iteration, so the loop variables they read cannot be bound late.
"src/urban_geometry/agent/entry_supports.py" = ["B023"]
"src/urban_geometry/agent/public_realm_crossings.py" = ["B023"]
"src/urban_geometry/agent/public_realm_fixtures.py" = ["B023"]
"src/urban_geometry/agent/urban_building.py" = ["B023"]
"src/urban_flow/physics/plot_core008_solar.py" = ["B023"]
